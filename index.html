<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกข้อความ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f3f4f6; }
        /* สไตล์สำหรับกล่องข้อความ */
        .msg-box { transition: all 0.2s; }
        .msg-box:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center py-10">

    <!-- คอนเทนเนอร์หลัก -->
    <div class="w-full max-w-md bg-white rounded-xl shadow-lg overflow-hidden">
        
        <!-- ส่วนหัว (Header สีน้ำเงิน) -->
        <div class="bg-blue-600 p-6 text-center text-white">
            <h1 class="text-xl font-semibold flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                </svg>
                ระบบบันทึกข้อความ
            </h1>
            <p class="text-sm text-blue-100 mt-1">ส่งข้อมูลไปยัง Google Sheet ของคุณ</p>
        </div>

        <div class="p-6">
            <!-- ฟอร์ม -->
            <form id="textForm" class="space-y-4">
                <div>
                    <textarea 
                        id="messageInput" 
                        rows="4" 
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all resize-none text-gray-700 placeholder-gray-400"
                        placeholder="พิมพ์ข้อความของคุณที่นี่..."
                        required
                    ></textarea>
                </div>
                
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors duration-200">
                    บันทึกข้อมูล
                </button>
            </form>

            <div id="statusMsg" class="mt-4 text-center text-sm font-medium h-5"></div>

            <div class="border-t border-gray-100 mt-6 pt-6"></div>

            <!-- ส่วนแสดงข้อความ -->
            <div>
                <h2 class="text-md font-medium text-gray-800 mb-4 flex items-center gap-2">
                    📋 ข้อความในระบบ
                    <span id="loadingData" class="text-xs text-blue-500 ml-auto hidden">กำลังโหลด...</span>
                </h2>
                <div id="messageList" class="space-y-3 max-h-96 overflow-y-auto pr-1">
                    <!-- กล่องข้อความประ (แสดงตอนไม่มีข้อมูล) -->
                    <div id="emptyState" class="border-2 border-dashed border-gray-200 rounded-lg p-6 text-center text-gray-400 text-sm hidden">
                        ยังไม่มีข้อความ กรุณาพิมพ์แล้วกดบันทึก
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ใส่ Web App URL ของคุณที่นี่!
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzKCSbdbIuP-bczDwPkOH2GlAV62dmbTJ9yRy2NoZMiyApM90eUnTehYA-Re6nkMZn92A/exec';

        const form = document.getElementById('textForm');
        const messageInput = document.getElementById('messageInput');
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMsg');
        const messageList = document.getElementById('messageList');
        const emptyState = document.getElementById('emptyState');
        const loadingData = document.getElementById('loadingData');

        // ฟังก์ชันโหลดข้อมูลตอนเปิดเว็บ
        function loadData() {
            loadingData.classList.remove('hidden');
            emptyState.classList.add('hidden');
            
            // ล้างข้อความเก่า (เผื่อมีค้าง) ยกเว้น emptyState
            Array.from(messageList.children).forEach(child => {
                if(child.id !== 'emptyState') child.remove();
            });

            // เรียกดึงข้อมูล (ใช้ GET Request)
            fetch(scriptURL)
                .then(response => response.json())
                .then(data => {
                    loadingData.classList.add('hidden');
                    
                    if (data.length === 0) {
                        emptyState.classList.remove('hidden');
                    } else {
                        emptyState.classList.add('hidden');
                        // วนลูปสร้างกล่องข้อความ
                        data.forEach(item => {
                            // ใช้ prepend หรือ append ก็ได้
                            // ถ้าอยากให้ข้อความใหม่สุดอยู่บน ให้แก้ฝั่ง Google Sheet ให้ส่งข้อมูลเรียงใหม่ หรือรับมาแล้ว reverse()
                            addMessageToScreen(item.id, item.text, item.time, false); 
                        });
                    }
                })
                .catch(error => {
                    console.error('Error loading data:', error);
                    loadingData.classList.add('hidden');
                    loadingData.innerText = 'โหลดข้อมูลล้มเหลว';
                    loadingData.classList.remove('hidden', 'text-blue-500');
                    loadingData.classList.add('text-red-500');
                });
        }

        // โหลดข้อมูลทันทีเมื่อเปิดหน้าเว็บ
        window.addEventListener('load', loadData);

        // จัดการเมื่อกดบันทึก
        form.addEventListener('submit', e => {
            e.preventDefault();
            const textValue = messageInput.value.trim();
            if (!textValue) return;

            submitBtn.disabled = true;
            submitBtn.innerHTML = 'กำลังบันทึก...';
            statusMsg.innerHTML = '';

            const messageId = Date.now().toString();
            const now = new Date();
            const timeStr = now.toLocaleTimeString('th-TH') + ' น.';

            const formData = new URLSearchParams();
            formData.append('action', 'save');
            formData.append('id', messageId);
            formData.append('time', timeStr);
            formData.append('text', textValue);

            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: formData })
            .then(() => {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'บันทึกข้อมูล';
                
                statusMsg.innerHTML = '<span class="text-green-600">✅ บันทึกสำเร็จ!</span>';
                setTimeout(() => statusMsg.innerHTML = '', 3000);

                // เติมกล่องใหม่ขึ้นไปข้างบนสุด
                addMessageToScreen(messageId, textValue, timeStr, true);
                messageInput.value = '';
            })
            .catch(() => {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'บันทึกข้อมูล';
                statusMsg.innerHTML = '<span class="text-red-500">❌ บันทึกล้มเหลว</span>';
            });
        });

        // ฟังก์ชันสร้าง UI กล่องข้อความ
        function addMessageToScreen(id, text, timeStr, prepend = true) {
            emptyState.classList.add('hidden');

            const msgBox = document.createElement('div');
            msgBox.className = 'msg-box p-3 bg-gray-50 border border-gray-200 rounded-lg text-sm';
            msgBox.setAttribute('data-id', id);
            
            const headerDiv = document.createElement('div');
            headerDiv.className = 'flex justify-between items-center mb-1.5';
            
            const timeDiv = document.createElement('div');
            timeDiv.className = 'text-xs text-gray-500 font-medium';
            timeDiv.innerText = timeStr;

            const actionDiv = document.createElement('div');
            actionDiv.className = 'flex gap-1.5';

            const copyBtn = document.createElement('button');
            copyBtn.className = 'text-[10px] bg-white border border-gray-200 hover:bg-gray-100 text-gray-600 px-2 py-0.5 rounded transition-colors';
            copyBtn.innerHTML = 'คัดลอก';
            copyBtn.onclick = () => {
                navigator.clipboard.writeText(text).then(() => {
                    copyBtn.innerHTML = 'สำเร็จ';
                    copyBtn.classList.replace('text-gray-600', 'text-green-600');
                    setTimeout(() => {
                        copyBtn.innerHTML = 'คัดลอก';
                        copyBtn.classList.replace('text-green-600', 'text-gray-600');
                    }, 2000);
                });
            };

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'text-[10px] bg-red-50 hover:bg-red-100 text-red-500 border border-red-100 px-2 py-0.5 rounded transition-colors';
            deleteBtn.innerHTML = 'ลบ';
            deleteBtn.onclick = () => {
                if(!confirm('ต้องการลบข้อความนี้ใช่หรือไม่?')) return;
                
                deleteBtn.innerHTML = 'กำลังลบ...';
                deleteBtn.disabled = true;

                const formData = new URLSearchParams();
                formData.append('action', 'delete');
                formData.append('id', id);

                fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: formData })
                .then(() => {
                    msgBox.remove();
                    // เช็คว่าเหลือกล่องไหม (ไม่นับ emptyState)
                    const remainingBoxes = Array.from(messageList.children).filter(child => child.id !== 'emptyState');
                    if (remainingBoxes.length === 0) {
                        emptyState.classList.remove('hidden');
                    }
                })
                .catch(() => {
                    alert('เกิดข้อผิดพลาดในการลบ');
                    deleteBtn.innerHTML = 'ลบ';
                    deleteBtn.disabled = false;
                });
            };

            actionDiv.appendChild(copyBtn);
            actionDiv.appendChild(deleteBtn);
            headerDiv.appendChild(timeDiv);
            headerDiv.appendChild(actionDiv);

            const textContent = document.createElement('div');
            textContent.className = 'text-gray-700 break-words whitespace-pre-wrap mt-1';
            textContent.innerText = text;

            msgBox.appendChild(headerDiv);
            msgBox.appendChild(textContent);

            if (prepend) {
                // เอาไว้หลัง emptyState
                if (messageList.firstChild === emptyState) {
                    messageList.insertBefore(msgBox, emptyState.nextSibling);
                } else {
                    messageList.prepend(msgBox);
                }
            } else {
                messageList.appendChild(msgBox);
            }
        }
    </script>
</body>
</html>
