<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกข้อความ</title>
    <!-- นำเข้า Tailwind CSS สำหรับตกแต่ง -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- นำเข้า Font Kanit จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex flex-col items-center py-10">

    <!-- คอนเทนเนอร์หลัก -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6">
        
        <!-- ส่วนหัว -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-semibold text-gray-800">ระบบบันทึกข้อความ</h1>
            <p class="text-gray-500 text-sm mt-1">พิมพ์ข้อความเพื่อส่งไปยัง Google Sheet</p>
        </div>

        <!-- ฟอร์มสำหรับส่งข้อมูล -->
        <form id="textForm" class="space-y-4">
            <div>
                <textarea 
                    id="messageInput" 
                    rows="4" 
                    class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all resize-none"
                    placeholder="พิมพ์ข้อความของคุณที่นี่..."
                    required
                ></textarea>
            </div>
            
            <button 
                type="submit" 
                id="submitBtn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition-colors duration-200 flex justify-center items-center gap-2"
            >
                <span>บันทึกข้อความ</span>
            </button>
        </form>

        <!-- ข้อความแจ้งเตือนสถานะ -->
        <div id="statusMsg" class="mt-4 text-center text-sm font-medium h-5"></div>

        <!-- เส้นคั่น -->
        <div class="border-t border-gray-200 mt-6 pt-6"></div>

        <!-- ส่วนแสดงข้อความบนหน้าเว็บ -->
        <div>
            <h2 class="text-lg font-medium text-gray-800 mb-4 flex items-center gap-2">
                📝 ข้อความล่าสุด
            </h2>
            <!-- กล่องรายการข้อความ -->
            <div id="messageList" class="space-y-3 max-h-80 overflow-y-auto pr-2">
                <!-- ข้อความจะถูกเพิ่มที่นี่อัตโนมัติด้วย JavaScript -->
                <p id="emptyState" class="text-gray-400 text-sm text-center py-4">ยังไม่มีข้อความในเซสชันนี้</p>
            </div>
        </div>

    </div>

    <!-- JavaScript สำหรับส่งข้อมูลและแสดงผล -->
    <script>
        const form = document.getElementById('textForm');
        const messageInput = document.getElementById('messageInput');
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMsg');
        const messageList = document.getElementById('messageList');
        const emptyState = document.getElementById('emptyState');

        // URL ของ Google Apps Script ของคุณ
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwq1L7j3qJ1wyHxUSLitk5TR8nD80hflg4q6ubyfrOUxM8_Dl-n4RFXx0VMNGpkZz9H/exec';

        form.addEventListener('submit', e => {
            e.preventDefault();
            const textValue = messageInput.value.trim();
            if (!textValue) return;

            // เปลี่ยนสถานะปุ่มเป็นกำลังโหลด
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                กำลังส่งข้อมูล...
            `;
            statusMsg.innerHTML = '';

            // แปลงข้อมูลให้อยู่ในรูปแบบ URLSearchParams
            const formData = new URLSearchParams();
            formData.append('text', textValue);
            formData.append('message', textValue);

            // ส่งข้อมูลไปยัง Google Sheets
            fetch(scriptURL, { 
                method: 'POST', 
                mode: 'no-cors', // เพิ่ม mode: 'no-cors' เพื่อแก้ปัญหา CORS Block
                body: formData 
            })
            .then(response => {
                // เมื่อใช้ no-cors เราอาจจะไม่ได้ response.ok ที่แท้จริงกลับมา 
                // แต่ถ้าผ่านขั้นตอนนี้มาได้ มักจะแปลว่าข้อมูลถูกส่งออกไปแล้ว
                
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'บันทึกข้อความ';
                
                statusMsg.innerHTML = '<span class="text-green-600">✅ ส่งข้อความแล้ว!</span>';
                setTimeout(() => statusMsg.innerHTML = '', 3000);

                // นำข้อความมาแสดงบนหน้าเว็บ
                addMessageToScreen(textValue);

                // เคลียร์กล่องข้อความ
                messageInput.value = '';
            })
            .catch(error => {
                console.error('Error!', error.message);
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'บันทึกข้อความ';
                statusMsg.innerHTML = '<span class="text-red-500">❌ เกิดข้อผิดพลาด กรุณาลองใหม่</span>';
            });
        });

        // ฟังก์ชันสร้างกล่องข้อความบนหน้าเว็บ
        function addMessageToScreen(text) {
            if (emptyState) {
                emptyState.style.display = 'none';
            }

            const msgBox = document.createElement('div');
            msgBox.className = 'p-3 bg-blue-50 border border-blue-100 rounded-xl shadow-sm text-gray-800 break-words';
            
            const timeDiv = document.createElement('div');
            timeDiv.className = 'text-xs text-gray-500 mb-1';
            const now = new Date();
            timeDiv.innerText = now.toLocaleTimeString('th-TH') + ' น.';

            const textContent = document.createElement('div');
            textContent.innerText = text;

            msgBox.appendChild(timeDiv);
            msgBox.appendChild(textContent);

            messageList.prepend(msgBox);
        }
    </script>
</body>
</html>
