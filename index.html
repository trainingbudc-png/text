<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save Text App</title>
    
    <!-- Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load Google Font (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* bg-gray-100 */
        }
        
        /* Custom spinner animation */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #ffffff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Card Container -->
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden transition-all duration-300">
        
        <!-- Header Section -->
        <div class="bg-indigo-600 px-6 py-5">
            <h1 class="text-2xl font-semibold text-white flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
                </svg>
                Save Message
            </h1>
            <p class="text-indigo-100 mt-1 text-sm">Enter the text you want to save to the database.</p>
        </div>

        <!-- Body Section -->
        <div class="p-6">
            <!-- Alert Message Box (Hidden by default) -->
            <div id="alertBox" class="hidden mb-4 p-4 rounded-lg flex items-start gap-3 transition-opacity duration-300 opacity-0">
                <div id="alertIcon" class="mt-0.5 flex-shrink-0"></div>
                <div id="alertText" class="text-sm font-medium"></div>
            </div>

            <!-- Input Form -->
            <form id="messageForm" class="space-y-4">
                <div>
                    <label for="messageInput" class="block text-sm font-medium text-gray-700 mb-1">Your Message</label>
                    <textarea 
                        id="messageInput" 
                        name="message" 
                        rows="5" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-shadow resize-none text-gray-800"
                        placeholder="Type your text here..."
                        required
                    ></textarea>
                </div>
                
                <button 
                    type="submit" 
                    id="submitBtn" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-xl transition-colors duration-200 flex justify-center items-center gap-2 shadow-sm focus:ring-4 focus:ring-indigo-200 outline-none disabled:opacity-70 disabled:cursor-not-allowed"
                >
                    <span id="btnText">Save Text</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const form = document.getElementById('messageForm');
            const messageInput = document.getElementById('messageInput');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const alertBox = document.getElementById('alertBox');
            const alertIcon = document.getElementById('alertIcon');
            const alertText = document.getElementById('alertText');

            // Target URL
            const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwq1L7j3qJ1wyHxUSLitk5TR8nD80hflg4q6ubyfrOUxM8_Dl-n4RFXx0VMNGpkZz9H/exec';

            // SVG Icons for Alerts
            const successIcon = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-green-600" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" /></svg>`;
            const errorIcon = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-600" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>`;

            // Show custom alert
            const showAlert = (message, type) => {
                alertBox.className = `mb-4 p-4 rounded-lg flex items-start gap-3 transition-opacity duration-300 opacity-100 ${
                    type === 'success' ? 'bg-green-50 text-green-800 border border-green-200' : 'bg-red-50 text-red-800 border border-red-200'
                }`;
                alertIcon.innerHTML = type === 'success' ? successIcon : errorIcon;
                alertText.innerText = message;
                alertBox.classList.remove('hidden');
            };

            // Hide alert
            const hideAlert = () => {
                alertBox.classList.add('opacity-0');
                setTimeout(() => {
                    alertBox.classList.add('hidden');
                }, 300);
            };

            // Form Submit Event
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideAlert();

                const textValue = messageInput.value.trim();
                if (!textValue) return;

                // 1. Set UI to Loading State
                submitBtn.disabled = true;
                btnText.innerHTML = '<div class="spinner mr-2"></div> Saving...';
                messageInput.disabled = true;

                // 2. Prepare payload using URLSearchParams to avoid CORS preflight blocks
                const payload = new URLSearchParams();
                payload.append('text', textValue);
                // Fallback key, depending on what your Apps Script expects
                payload.append('message', textValue); 

                try {
                    // 3. Send POST request
                    // Apps script might return a CORS error on the browser even if it succeeds 
                    // depending on the Google Apps Script return method. We try catching standard fetch first.
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: payload,
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        }
                    });

                    // Google Apps Script usually returns a 200 or 302
                    showAlert('Message saved successfully!', 'success');
                    messageInput.value = ''; // Clear text
                    
                } catch (error) {
                    // Note: If Google Apps Script handles the insert but doesn't return proper CORS headers, 
                    // it might throw a TypeError here. In production, 'no-cors' mode can be used if you don't need to read the response.
                    console.error('Submission Error:', error);
                    showAlert('Message sent, but the server response was unclear. Please check your database.', 'success'); 
                    // Using 'success' visually as a fallback because GAS often succeeds but blocks the response in browser JS.
                    messageInput.value = '';
                } finally {
                    // 4. Reset Button & Input
                    submitBtn.disabled = false;
                    btnText.innerHTML = 'Save Text';
                    messageInput.disabled = false;
                    messageInput.focus();
                }
            });
        });
    </script>
</body>
</html>
